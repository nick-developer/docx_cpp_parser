[build-system]
# scikit-build-core invokes CMake automatically, produces correctly tagged
# platform wheels (e.g. cp311-cp311-win_amd64), and handles MSVC / MinGW /
# GCC / Clang toolchains without any extra configuration.
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "docx-comment-parser"
version = "1.5.1"
description = "Fast C++ library for extracting comment metadata from .docx files"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "nick-developer"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
# The core package has ZERO runtime dependencies — this is the whole point of
# the library.  Everything optional lives in the extras below.
dependencies = []

[project.optional-dependencies]
# DataFrame export back-ends.
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
# The `docx-comments` command-line tool.
cli    = ["typer>=0.12", "rich>=13.0"]
# Interactive HTML review reports (Markdown reports need no extra).
report = ["jinja2>=3.0"]
# Accelerated fuzzy matching for compare_comments(). Optional: without it the
# diff engine falls back to difflib from the standard library, which produces
# the same kind of answer more slowly.
diff   = ["rapidfuzz>=3.0"]
# Exact token counting for the LLM export's chunking and prompt budgets.
# Optional: without it, chunking uses a calibrated estimate that errs high, so
# a chunk never overflows a model's window because the count was optimistic.
# There are still no AI dependencies here — tiktoken is a tokenizer, offline.
llm    = ["tiktoken>=0.7"]
# Everything a user could want, in one go.
all    = ["pandas>=2.0", "polars>=1.0", "typer>=0.12", "rich>=13.0",
          "jinja2>=3.0", "rapidfuzz>=3.0", "tiktoken>=0.7"]
# Development / CI.
dev    = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.8",
          "pandas>=2.0", "polars>=1.0", "typer>=0.12", "rich>=13.0",
          "jinja2>=3.0", "rapidfuzz>=3.0"]

[project.scripts]
# Always registered, even without the [cli] extra: the entry point prints an
# actionable install hint when Typer/Rich are missing rather than tracebacking.
docx-comments = "docx_comment_parser.cli:main"

[tool.scikit-build]
# Always build in Release mode for distributed wheels.
cmake.build-type = "Release"

# Pass extra CMake args:
#   - disable the test suite (not needed inside the wheel)
#   - disable the standalone shared library (the wheel only needs the Python
#     extension; the extension itself compiles all C++ sources in via setup.py)
cmake.args = ["-DBUILD_TESTS=OFF"]

# The pure-Python wrapper package.  CMake installs the compiled extension as
# docx_comment_parser/_core.<abi>.pyd into the same directory, so the wheel
# contains one coherent package.
wheel.packages = ["src/docx_comment_parser"]

# Keep the C++ sources in the sdist so `pip install --no-binary` can rebuild,
# and carry the report templates/assets, which the HTML report reads at render
# time and therefore must ship.
#
# These are listed by extension rather than as a blanket "src/**": that glob
# also swept up whatever the local working tree happened to contain — every
# __pycache__ directory and the in-place-built _core.pyd, so an sdist produced
# on Windows shipped a Windows binary inside it.
sdist.include = [
    "src/**/*.py",
    "src/**/*.pyi",
    "src/**/py.typed",
    "src/**/*.cpp",
    "src/**/*.j2",
    "src/**/*.css",
    "src/**/*.js",
    "include/**",
    "python/**",
    "vendor/**",
    "CMakeLists.txt",
]
sdist.exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyd", "**/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
markers = [
    "perf: performance and scale tests (deselect with -m 'not perf')",
]

[tool.mypy]
# 3.10 is the oldest version current mypy will type-check against. The package
# itself still supports 3.9: every module uses `from __future__ import
# annotations`, and the one 3.10-only feature (dataclass slots) is guarded by an
# explicit sys.version_info check in models.py.
python_version = "3.10"
strict = true
files = ["src/docx_comment_parser"]
mypy_path = "src"
# The compiled extension has no inline types; its shape is declared in
# _core.pyi, which mypy picks up automatically.

[[tool.mypy.overrides]]
module = [
    # Both forms of each name: mypy's "pkg.*" matches a package's submodules
    # but not the package itself.
    "pandas", "pandas.*", "polars", "polars.*", "numpy", "numpy.*",
    "typer", "typer.*", "rich", "rich.*", "click", "click.*",
    "jinja2", "jinja2.*", "markupsafe", "markupsafe.*",
    "rapidfuzz", "rapidfuzz.*",
    "tiktoken", "tiktoken.*",
]
ignore_missing_imports = true
# Third-party internals are not ours to type-check, and numpy's stubs require a
# newer python_version than we target.
follow_imports = "skip"
# rapidfuzz ships .pyi stubs, and follow_imports alone does not apply to stub
# files — without this mypy walks into rapidfuzz's stubs, then into numpy's,
# and dies on syntax that only exists from 3.12 onwards.
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["docx_comment_parser._cli_app"]
# Typer's @app.command() is Any under follow_imports=skip, which makes strict
# mode call every decorated command untyped. The command bodies themselves are
# fully annotated and still checked.
disallow_untyped_decorators = false
